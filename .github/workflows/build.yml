name: linux-build

on:
  push:
    branches: [ main ]
    tags: [ 'v0.*' ]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel for manual runs'
        required: false
        default: 'edge'
        type: choice
        options:
          - edge
          - nightly

permissions:
  contents: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Only the scheduled nightly is skipped. Every other event builds.
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="${{ github.sha }}"
          BODY="$(gh release view nightly --json body --jq '.body' 2>/dev/null || true)"
          if [[ "$BODY" == *"Build-SHA: $SHA"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly already built for $SHA; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build FlashDraft.Linux.sln -c Release
      - name: Publish self-contained payload
        run: dotnet publish src/FlashDraft.Desktop/FlashDraft.Desktop.csproj -c Release -r linux-x64 --self-contained true -o ./publish
      - name: Fetch canonical license
        run: |
          curl -fsSL https://raw.githubusercontent.com/rainbowcrr-sys/flashdraft-core/main/LICENSE -o packaging/LICENSE.txt \
            || cp LICENSE packaging/LICENSE.txt
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build directly installable deb and rpm
        run: |
          set -e
          cp packaging/LICENSE.txt publish/LICENSE.txt
          nfpm package -f packaging/nfpm.yaml -p deb -t FlashDraft-Linux-x64.deb
          nfpm package -f packaging/nfpm.yaml -p rpm -t FlashDraft-Linux-x64.rpm
          test -s FlashDraft-Linux-x64.deb
          test -s FlashDraft-Linux-x64.rpm
      - name: Portable tarball
        run: tar -czf FlashDraft-Linux-x64-Portable.tar.gz -C ./publish .
      - name: Checksum
        run: sha256sum FlashDraft-Linux-x64.deb FlashDraft-Linux-x64.rpm FlashDraft-Linux-x64-Portable.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flashdraft-linux
          if-no-files-found: error
          path: |
            ./FlashDraft-Linux-x64.deb
            ./FlashDraft-Linux-x64.rpm
            ./FlashDraft-Linux-x64-Portable.tar.gz
            ./SHA256SUMS.txt
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: flashdraft-*
          path: dist
          merge-multiple: true
      - name: Publish build artifacts to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          {
          set -eu
          mapfile -t FILES < <(find dist -type f -print)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No build artifacts were downloaded"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="FlashDraft ${TAG}"
            NOTES="Stable release ${TAG}. All packages are unsigned; verify SHA256SUMS before use."
            PRERELEASE=0
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${{ inputs.channel }}" == "nightly" ]]; then
            TAG="nightly"
            TITLE="Nightly build $(date -u +%F)"
            NOTES="Automated nightly build. Unsigned and unverified; use at your own risk."
            PRERELEASE=1
          else
            TAG="edge"
            TITLE="Edge build"
            NOTES="Rolling build from the main branch. Unsigned and unverified."
            PRERELEASE=1
          fi
          NOTES="${NOTES} | Build-SHA: ${GITHUB_SHA}"
          ARGS=()
          if [[ "$PRERELEASE" == "1" ]]; then ARGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Remove stale assets so nightly/edge releases never accumulate old files.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              gh release delete-asset "$TAG" "$name" --yes >/dev/null 2>&1 || true
            done
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES" || true
          else
            gh release create "$TAG" "${ARGS[@]}" --title "$TITLE" --notes "$NOTES" "${FILES[@]}"
          fi
          echo "Published ${#FILES[@]} file(s) to release $TAG"
          } > release.log 2>&1
          status=$?
          cat release.log
          if [ "$status" -ne 0 ]; then
            tail -30 release.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
